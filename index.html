<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <!-- Description meta — shows up in Google snippets and link previews. -->
    <meta
      name="description"
      content="Alejandro Scaffa, PhD, Assistant Professor of Biology at Grinnell College. Research in cellular senescence, stress responses, computational biology, and quantitative image analysis."
    />
    <!-- Mobile viewport — required for Tailwind's responsive utilities to behave. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Fonts: Inter for body, Source Serif Pro for headings. Loaded from Google Fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+Pro:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <title>Alejandro Scaffa</title>

    <!--
      Structured data (schema.org Person, JSON-LD). Tells search engines
      that this site is about a specific researcher and consolidates the
      person's identity across multiple profiles via `sameAs`. Foundational
      signal for things like a Google Knowledge Panel.

      When the Grinnell appointment starts, drop "Incoming " from
      jobTitle. Add ORCID / Wikidata entries to the sameAs array as
      they're created.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Alejandro Scaffa",
        "honorificSuffix": "PhD",
        "url": "https://alejandroscaffa.com",
        "image": "https://alejandroscaffa.com/images/portrait.jpg",
        "jobTitle": "Incoming Assistant Professor of Biology",
        "worksFor": {
          "@type": "CollegeOrUniversity",
          "name": "Grinnell College",
          "url": "https://www.grinnell.edu"
        },
        "alumniOf": [
          { "@type": "CollegeOrUniversity", "name": "Brown University" },
          { "@type": "CollegeOrUniversity", "name": "Northeastern University" },
          { "@type": "CollegeOrUniversity", "name": "Grinnell College" }
        ],
        "knowsAbout": [
          "Cellular senescence",
          "Computational pathology",
          "Single-cell RNA sequencing",
          "Tumor microenvironment",
          "Quantitative image analysis",
          "Cancer-associated fibroblasts",
          "Bronchopulmonary dysplasia"
        ],
        "sameAs": [
          "https://orcid.org/0000-0002-9493-6912",
          "https://scholar.google.com/citations?user=UsU8mJcAAAAJ",
          "https://www.linkedin.com/in/alejandroscaffa",
          "https://github.com/disruptivecorp"
        ]
      }
    </script>
    <!--
      SPA-routing restoration — paired with public/404.html. When a deep
      link (e.g. /publications) was rewritten by 404.html into /?/publications,
      this script reads the encoded path back out and replaces the URL in
      history with the original. React Router then sees /publications and
      renders the right route. No-op when there's no encoded path.
    -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            "",
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <!-- React mounts into this div via src/main.tsx -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
